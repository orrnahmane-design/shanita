<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shanita — סטודיו לציפורניים</title>
<meta name="description" content="Shanita — סטודיו לציפורניים: לק ג'ל, בניית ציפורניים, פרנץ' ואומברה. סלון רגוע ומוקפד, בתיאום תור מראש.">
<meta name="theme-color" content="#fbf7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1216" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap">
<style>
/* ============================================================
   Shanita — redesign following the Apple Design Skill
   (dickwu/apple-design-skill). See DESIGN-NOTES.md.
   Layers: content (opaque) and functional (glass on header + CTA only).
   ============================================================ */
:root{
  color-scheme: light dark;

  /* ---- palette, light ---- */
  --bg:#fbf7f4;            /* warm paper, from the salon's own light */
  --surface:#ffffff;
  --tint:#f4e9ee;          /* the logo's pale pink, held back to a tint */
  --ink:#3d2b33;           /* 12.4:1 on --bg */
  --ink-soft:#5a4650;      /* 8.1:1 on --bg */
  --accent:#8a2f5c;        /* 7.5:1 on --bg, 7.9:1 with white text */
  --accent-ink:#ffffff;
  --line:#e6dadf;
  --ring:#c9a2b3;

  /* ---- type ---- */
  --f-display:'Frank Ruhl Libre','David Libre',Georgia,serif;
  --f-body:'Assistant','Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* scale (rem on a 100% root, so the browser's text setting carries through) */
  --t-hero:clamp(2.1rem,1.3rem + 3.4vw,3.9rem);
  --t-h2:clamp(1.5rem,1.15rem + 1.5vw,2.15rem);
  --t-h3:1.12rem;
  --t-lead:clamp(1.02rem,.97rem + .3vw,1.15rem);
  --t-body:1rem;
  --t-small:.9rem;
  --t-label:.82rem;

  /* ---- layout ---- */
  --maxw:1120px;
  --pad:clamp(18px,5vw,40px);
  --header-h:64px;
  --r-sm:10px;
  --r:16px;
  --r-lg:26px;
  --ease:cubic-bezier(.22,.7,.24,1);
  --spring:cubic-bezier(.34,1.3,.5,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1216;            /* 15.5:1 with --ink */
    --surface:#241a20;
    --tint:#2b1d25;
    --ink:#f3e9ed;
    --ink-soft:#c9b4bd;      /* 9.4:1 */
    --accent:#f0a9c6;        /* 9.8:1 on --bg */
    --accent-ink:#1a1216;    /* 9.8:1 on --accent */
    --line:#3a2b33;
    --ring:#5a3f4c;
  }
}

*,*::before,*::after{box-sizing:border-box}
html{
  direction:rtl;
  font-size:100%;
  scroll-behavior:smooth;
  scroll-padding-top:calc(var(--header-h) + 16px);
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:var(--t-body);
  line-height:1.65;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}

:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{
  width:100%;
  max-width:var(--maxw);
  margin-inline:auto;
  padding-inline:max(var(--pad), env(safe-area-inset-left));
}

/* ---------- typography roles ---------- */
.h-display{
  font-family:var(--f-display);
  font-weight:900;
  font-size:var(--t-hero);
  line-height:1.08;
  letter-spacing:-.01em;
  text-wrap:balance;
}
.h-section{
  font-family:var(--f-display);
  font-weight:700;
  font-size:var(--t-h2);
  line-height:1.2;
  letter-spacing:-.005em;
  text-wrap:balance;
}
.h-card{font-family:var(--f-display);font-weight:700;font-size:var(--t-h3);line-height:1.3}
.lead{font-size:var(--t-lead);color:var(--ink-soft);max-width:54ch}
.body{color:var(--ink-soft);max-width:62ch}
.label{
  display:inline-flex;align-items:center;gap:.6rem;
  font-size:var(--t-label);font-weight:700;letter-spacing:.02em;
  color:var(--accent);
}
.label::before{content:"";width:26px;height:2px;background:currentColor;border-radius:2px}
mark{background:none;color:inherit}
.hero mark{color:var(--accent)}

/* ---------- buttons: 44px minimum, one prominent per view ---------- */
.btn{
  --h:48px;
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  min-height:var(--h);padding:.6rem 1.4rem;
  border:1px solid transparent;border-radius:999px;
  font-weight:600;font-size:1rem;line-height:1.2;text-decoration:none;
  cursor:pointer;transition:background .2s var(--ease), border-color .2s var(--ease), transform .12s var(--ease);
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-quiet:hover{background:var(--tint)}
.btn svg{width:1.1em;height:1.1em;flex:none}

/* ---------- functional layer: glass, used sparingly ---------- */
.site-header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:50;
  background:color-mix(in srgb, var(--bg) 74%, transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);
  backdrop-filter:blur(22px) saturate(1.3);
  border-bottom:1px solid var(--line);
}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:var(--header-h)}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;min-height:44px}
/* ---- לוגו מסתובב בהדר: לוגו במרכז, טקסט רץ סביבו ---- */
.brand .mark{
  position:relative;flex:none;
  width:44px;height:44px;
  display:grid;place-items:center;
}
.brand .mark img{
  position:relative;z-index:1;
  width:30px;height:30px;border-radius:50%;
}
.brand .mark .spin{
  position:absolute;inset:0;width:100%;height:100%;
  animation:spin 18s linear infinite;
}
.brand .mark text{
  font-family:var(--f-body);font-size:9.6px;font-weight:700;
  letter-spacing:.14em;fill:var(--accent);
}
.brand:hover .mark .spin{animation-duration:6s}
@media (prefers-reduced-motion: reduce){
  .brand .mark .spin{animation:none}
}
@media (max-width:420px){
  .brand .mark{width:40px;height:40px}
  .brand .mark img{width:27px;height:27px}
}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1}
.nav{display:flex;align-items:center;gap:.2rem}
.nav a{
  display:inline-flex;align-items:center;min-height:44px;padding-inline:.7rem;
  text-decoration:none;color:var(--ink-soft);font-size:.98rem;font-weight:600;border-radius:8px;
  transition:color .2s;
}
.nav a:hover{color:var(--ink)}
.site-header .btn{--h:44px;font-size:.95rem;padding-inline:1.1rem}
@media (max-width:900px){
  .nav{
    order:3;width:100%;gap:0;
    overflow-x:auto;overscroll-behavior-inline:contain;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line);margin-top:-1px;
  }
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding-inline:.85rem}
  .site-header .wrap{flex-wrap:wrap;padding-block:.4rem}
  .site-header .wrap .btn{min-width:44px}
}

/* ---------- hero ---------- */
.hero{padding-block:clamp(32px,5vw,64px) clamp(48px,7vw,88px)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,64px);align-items:center}
.hero-copy{display:flex;flex-direction:column;align-items:flex-start;gap:1.35rem;min-width:0}
.cta-row{display:flex;flex-wrap:wrap;gap:.75rem;width:100%}
.facts{display:flex;flex-wrap:wrap;gap:.5rem .6rem}
.facts li{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.4rem .8rem;border-radius:999px;
  background:var(--tint);color:var(--ink);
  font-size:var(--t-small);font-weight:600;
}
.facts svg{width:.9em;height:.9em;color:var(--accent)}
